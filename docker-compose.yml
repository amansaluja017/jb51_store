services:
  # Next.js Web Storefront
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: jb51-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    depends_on:
      - api
    networks:
      - jb51-network

  # Backend Express & tRPC API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: jb51-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - apps/api/.env
    networks:
      - jb51-network

networks:
  jb51-network:
    driver: bridge
